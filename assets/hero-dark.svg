<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060B14" />
      <stop offset="55%" stop-color="#0B1325" />
      <stop offset="100%" stop-color="#091926" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14B8A6" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <radialGradient id="orbTeal" cx="20%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orbCyan" cx="85%" cy="75%" r="45%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>
    <pattern id="blueprintGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.45" />
    </pattern>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(1.35); }
    }
    @keyframes scanline {
      0% { transform: translateX(-200px); opacity: 0; }
      50% { opacity: 0.9; }
      100% { transform: translateX(1200px); opacity: 0; }
    }
    @keyframes blinkCursor {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    .pulse { animation: pulseDot 2.4s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    .cursor { animation: blinkCursor 1.1s infinite; }
    .scan { animation: scanline 7s ease-in-out infinite; }
    .float-card { animation: floatSlow 5s ease-in-out infinite; }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="340" rx="20" fill="url(#heroBg)" stroke="#1E293B" stroke-width="1.5" />
  <rect width="1200" height="340" rx="20" fill="url(#blueprintGrid)" />
  <rect width="1200" height="340" rx="20" fill="url(#orbTeal)" />
  <rect width="1200" height="340" rx="20" fill="url(#orbCyan)" />

  <!-- Top Animated Laser Accent Line -->
  <rect x="40" y="1" width="1120" height="2" fill="url(#brandGrad)" opacity="0.45" />
  <rect class="scan" x="0" y="0" width="220" height="3" fill="url(#brandGrad)" rx="1.5" />

  <!-- Top Telemetry Bar -->
  <g transform="translate(48, 30)">
    <rect x="0" y="0" width="338" height="28" rx="14" fill="#132238" stroke="#23395B" stroke-width="1" />
    <circle class="pulse" cx="16" cy="14" r="4.5" fill="#10B981" />
    <text x="29" y="18" class="font-mono" font-size="11" font-weight="600" fill="#F8FAFC" letter-spacing="0.6">AVAILABLE FOR PROJECTS &amp; CONSULTING</text>

    <rect x="350" y="0" width="188" height="28" rx="14" fill="#132238" stroke="#23395B" stroke-width="1" />
    <text x="366" y="18" class="font-mono" font-size="11" font-weight="500" fill="#94A3B8">📍 MOROCCO · UTC+1</text>
  </g>

  <!-- Left Column: Identity & Mission -->
  <g transform="translate(48, 92)">
    <text x="0" y="0" class="font-mono" font-size="12" font-weight="700" fill="#14B8A6" letter-spacing="2.2">FOUNDER · PRINCIPAL FULL-STACK &amp; SYSTEMS ARCHITECT</text>
    <text x="0" y="54" class="font-sans" font-size="56" font-weight="800" fill="#F8FAFC" letter-spacing="-1.2">MrZaKaRiA</text>
    <rect x="308" y="34" width="12" height="12" rx="3" fill="#14B8A6" />

    <text x="0" y="92" class="font-sans" font-size="17" font-weight="500" fill="#94A3B8">
      Building high-craft software from the <tspan fill="#F8FAFC" font-weight="700">interface</tspan> to the <tspan fill="#F8FAFC" font-weight="700">bare-metal infrastructure</tspan>.
    </text>
    <text x="0" y="118" class="font-sans" font-size="14.5" fill="#94A3B8">
      Architecting AI-native ERP &amp; CRM platforms, Astro/Vue/React web systems, Apple Silicon
    </text>
    <text x="0" y="140" class="font-sans" font-size="14.5" fill="#94A3B8">
      virtualization (<tspan fill="#38BDF8" font-weight="600">LumenVM</tspan>), Suckless Linux distributions (<tspan fill="#14B8A6" font-weight="600">AbyssLinux</tspan>), and server tooling.
    </text>

    <!-- Domain Pillars -->
    <g transform="translate(0, 166)">
      <rect x="0" y="0" width="148" height="32" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1.2" />
      <text x="14" y="20" class="font-mono" font-size="11.5" font-weight="600" fill="#14B8A6">⚡ Web &amp; Astro 7</text>

      <rect x="158" y="0" width="166" height="32" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1.2" />
      <text x="172" y="20" class="font-mono" font-size="11.5" font-weight="600" fill="#38BDF8">🏢 AI ERP &amp; CRM OS</text>

      <rect x="334" y="0" width="174" height="32" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1.2" />
      <text x="348" y="20" class="font-mono" font-size="11.5" font-weight="600" fill="#818CF8">🍎 Swift &amp; Tauri v2</text>

      <rect x="518" y="0" width="174" height="32" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1.2" />
      <text x="532" y="20" class="font-mono" font-size="11.5" font-weight="600" fill="#F59E0B">🐧 Linux &amp; Docker</text>
    </g>
  </g>

  <!-- Right Column: Live Interactive Terminal Card -->
  <g class="float-card" transform="translate(765, 32)">
    <rect x="0" y="0" width="390" height="276" rx="14" fill="#070B12" stroke="#0D9488" stroke-width="1.3" stroke-opacity="0.7" />
    <path d="M 0 14 Q 0 0 14 0 L 376 0 Q 390 0 390 14 L 390 36 L 0 36 Z" fill="#111827" />
    <circle cx="20" cy="18" r="5.5" fill="#F43F5E" />
    <circle cx="38" cy="18" r="5.5" fill="#F59E0B" />
    <circle cx="56" cy="18" r="5.5" fill="#10B981" />
    <text x="195" y="22" text-anchor="middle" class="font-mono" font-size="11" fill="#94A3B8">mrzakaria@abyss-macos ~ zsh</text>

    <g transform="translate(20, 58)" class="font-mono" font-size="12">
      <text x="0" y="0" fill="#2DD4BF">❯ <tspan fill="#F8FAFC" font-weight="600">sysinfo --architect MrZaKaRiA</tspan></text>

      <text x="0" y="26" fill="#64748B">├─</text>
      <text x="22" y="26" fill="#94A3B8">venture    :</text>
      <text x="116" y="26" fill="#38BDF8" font-weight="600">mrzakaria.com · RAIN STUDIO</text>

      <text x="0" y="48" fill="#64748B">├─</text>
      <text x="22" y="48" fill="#94A3B8">flagships  :</text>
      <text x="116" y="48" fill="#F8FAFC">RIVER ERP · LumenVM · Abyss</text>

      <text x="0" y="70" fill="#64748B">├─</text>
      <text x="22" y="70" fill="#94A3B8">daily_os   :</text>
      <text x="116" y="70" fill="#14B8A6">macOS ARM64 · VoidLinux + dwm</text>

      <text x="0" y="92" fill="#64748B">├─</text>
      <text x="22" y="92" fill="#94A3B8">production :</text>
      <text x="116" y="92" fill="#F59E0B">Debian · Docker · Webmin</text>

      <text x="0" y="114" fill="#64748B">├─</text>
      <text x="22" y="114" fill="#94A3B8">codebase   :</text>
      <text x="116" y="114" fill="#A78BFA">88.9 MB across 61 Original Repos</text>

      <text x="0" y="136" fill="#64748B">└─</text>
      <text x="22" y="136" fill="#94A3B8">velocity   :</text>
      <text x="116" y="136" fill="#10B981" font-weight="700">2,972 commits/yr (3,433+ total)</text>

      <line x1="0" y1="156" x2="350" y2="156" stroke="#1E293B" stroke-width="1" />

      <text x="0" y="178" fill="#2DD4BF">❯ <tspan fill="#F8FAFC">status --check</tspan></text>
      <text x="0" y="200" fill="#10B981">✔ All systems operational · Shipping daily</text>
      <rect class="cursor" x="308" y="189" width="8" height="14" fill="#2DD4BF" />
    </g>
  </g>
</svg>
