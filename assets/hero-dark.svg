      <stop offset="1" stop-color="#E2603B" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="nameClip"><rect x="0" y="0" width="0" height="460">
      <animate attributeName="width" from="0" to="1200" dur="1.6s" begin=".2s" fill="freeze" calcMode="spline" keySplines=".65 0 .35 1" keyTimes="0;1"/>
    </rect></clipPath>
