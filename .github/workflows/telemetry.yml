name: Sync Live Profile Telemetry SVGs

on:
  schedule:
    - cron: "15 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telemetry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-telemetry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate live telemetry SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_profile.py

      - name: Commit & push updated SVG assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg assets/telemetry-snapshot.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(telemetry): sync live GitHub profile SVG metrics [skip ci]"
            git push
          fi
